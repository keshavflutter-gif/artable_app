<svg viewBox="0 0 240 140" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <linearGradient id="canvasGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD166"/>
      <stop offset="45%" stop-color="#FF5C8A"/>
      <stop offset="100%" stop-color="#8B3DFF"/>
    </linearGradient>
    <radialGradient id="easelGlow" cx="50%" cy="60%" r="60%">
      <stop offset="0%" stop-color="#FF9AC1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FF9AC1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="120" cy="132" rx="110" ry="7" fill="#8B3DFF" opacity="0.10"/>
  <circle cx="115" cy="60" r="70" fill="url(#easelGlow)"/>

  <!-- palette -->
  <g transform="translate(150,88) rotate(18)">
    <path d="M0,10 a20,15 0 1 1 34,4 c2,6 -3,10 -9,8 c-5,-2 -8,2 -12,4 a20,15 0 0 1 -13,-16z" fill="#fff" opacity="0.9" stroke="#C246E8" stroke-width="1.5"/>
    <circle cx="7" cy="8" r="2.4" fill="#FF3D77"/>
    <circle cx="15" cy="4" r="2.4" fill="#FFC93C"/>
    <circle cx="23" cy="7" r="2.4" fill="#4C6CF7"/>
    <circle cx="12" cy="16" r="2.4" fill="#3CBF8A"/>
  </g>

  <!-- canvas -->
  <rect x="76" y="24" width="76" height="58" rx="3" fill="url(#canvasGrad)" opacity="0.95"/>
  <circle cx="98" cy="42" r="8" fill="#fff" opacity="0.55"/>
  <path d="M76,76 L112,46 L132,64 L152,44 L152,82 L76,82 Z" fill="#fff" opacity="0.32"/>
  <rect x="76" y="24" width="76" height="58" rx="3" fill="none" stroke="#fff" stroke-opacity="0.4" stroke-width="1.5"/>

  <!-- easel frame -->
  <line x1="64" y1="10" x2="160" y2="128" stroke="#5B4B8A" stroke-width="3.2" stroke-linecap="round"/>
  <line x1="164" y1="10" x2="92" y2="128" stroke="#5B4B8A" stroke-width="3.2" stroke-linecap="round"/>
  <line x1="48" y1="120" x2="178" y2="120" stroke="#5B4B8A" stroke-width="3.2" stroke-linecap="round"/>
  <line x1="70" y1="88" x2="158" y2="88" stroke="#5B4B8A" stroke-width="2.4" stroke-linecap="round"/>

  <!-- paint drip accents -->
  <path d="M60,92 q4,10 -2,16" stroke="#FF3D77" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6"/>
  <path d="M170,96 q-4,10 3,15" stroke="#4C6CF7" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.55"/>

  <!-- leaves -->
  <g fill="#3CBF8A">
    <path d="M18,132 C12,108 24,90 36,84 C42,102 40,120 30,132 Z"/>
    <path d="M212,134 C204,108 218,92 230,88 C235,106 232,124 220,134 Z"/>
  </g>
  <g fill="#2AA477">
    <path d="M26,132 C22,116 30,104 38,100 C41,112 39,124 32,132 Z" opacity="0.8"/>
  </g>

  <!-- sparkle accents -->
  <path d="M204,26 L206,32 L212,34 L206,36 L204,42 L202,36 L196,34 L202,32 Z" fill="#FFC93C" opacity="0.85"/>
  <circle cx="30" cy="40" r="3.4" fill="#FF3D77" opacity="0.7"/>
  <circle cx="182" cy="16" r="2.4" fill="#8B3DFF" opacity="0.6"/>
</svg>
