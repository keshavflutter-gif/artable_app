<svg viewBox="0 0 280 240" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <linearGradient id="ob3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFC93C"/>
      <stop offset="50%" stop-color="#C246E8"/>
      <stop offset="100%" stop-color="#4C6CF7"/>
    </linearGradient>
    <linearGradient id="ob3Spot" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#E0B3FF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#E0B3FF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <circle cx="140" cy="120" r="104" fill="url(#ob3Grad)" opacity="0.09"/>
  <polygon points="140,12 100,190 180,190" fill="url(#ob3Spot)"/>

  <!-- ribbon banner -->
  <path d="M92,84 h96 l-10,16 10,16 h-96 l10,-16z" fill="#fff" opacity="0.55"/>
  <text x="140" y="90" font-family="Poppins, sans-serif" font-weight="700" font-size="13" fill="url(#ob3Grad)" text-anchor="middle">WINNER</text>

  <!-- gift box -->
  <rect x="100" y="112" width="80" height="70" rx="7" fill="url(#ob3Grad)"/>
  <rect x="100" y="112" width="80" height="19" fill="#fff" opacity="0.28"/>
  <rect x="132" y="112" width="16" height="70" fill="#fff" opacity="0.4"/>
  <path d="M140,112 c-10,-24 -36,-15 -32,0 c4,11 24,7 32,0z" fill="url(#ob3Grad)"/>
  <path d="M140,112 c10,-24 36,-15 32,0 c-4,11 -24,7 -32,0z" fill="url(#ob3Grad)"/>

  <!-- coins -->
  <circle cx="56" cy="164" r="19" fill="url(#ob3Grad)" opacity="0.95"/>
  <circle cx="56" cy="164" r="13" fill="none" stroke="#fff" stroke-width="1.6" opacity="0.6"/>
  <text x="56" y="170" font-size="17" text-anchor="middle" fill="#fff" font-family="Poppins, sans-serif" font-weight="700">$</text>
  <circle cx="216" cy="170" r="16" fill="url(#ob3Grad)" opacity="0.9"/>
  <text x="216" y="176" font-size="14" text-anchor="middle" fill="#fff" font-family="Poppins, sans-serif" font-weight="700">%</text>
  <circle cx="200" cy="132" r="10" fill="url(#ob3Grad)" opacity="0.85"/>
  <text x="200" y="137" font-size="10" text-anchor="middle" fill="#fff" font-family="Poppins, sans-serif" font-weight="700">$</text>

  <!-- badge/star -->
  <path d="M214,56 l7,14 15,2 -11,11 3,15 -14,-7 -14,7 3,-15 -11,-11 15,-2z" fill="url(#ob3Grad)"/>
  <circle cx="214" cy="72" r="7" fill="#fff" opacity="0.35"/>

  <!-- confetti -->
  <circle cx="44" cy="70" r="4.2" fill="#FFC93C" opacity="0.8"/>
  <circle cx="62" cy="44" r="3" fill="#FF3D77" opacity="0.75"/>
  <polygon points="30,110 36,106 37,115" fill="#4C6CF7" opacity="0.6"/>
  <polygon points="238,110 244,106 245,115" fill="#8B3DFF" opacity="0.6"/>
</svg>
