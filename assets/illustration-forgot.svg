<svg viewBox="0 0 200 150" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <linearGradient id="fpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA53C"/>
      <stop offset="55%" stop-color="#FF3D77"/>
      <stop offset="100%" stop-color="#8B3DFF"/>
    </linearGradient>
    <radialGradient id="fpGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#FFC08A" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#FFC08A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="100" cy="138" rx="78" ry="7" fill="#8B3DFF" opacity="0.10"/>
  <circle cx="100" cy="72" r="66" fill="url(#fpGlow)"/>

  <!-- dashed flight path -->
  <path d="M18,110 C50,70 70,120 100,90" fill="none" stroke="url(#fpGrad)" stroke-width="2.4" stroke-dasharray="4 6" opacity="0.6"/>

  <!-- envelope -->
  <rect x="34" y="42" width="112" height="74" rx="13" fill="#fff" stroke="url(#fpGrad)" stroke-width="3.2"/>
  <path d="M36,46 L90,86 L144,46" fill="none" stroke="url(#fpGrad)" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M36,112 L70,84 M144,112 L110,84" stroke="url(#fpGrad)" stroke-width="2" opacity="0.5"/>

  <!-- key badge -->
  <circle cx="132" cy="104" r="24" fill="url(#fpGrad)"/>
  <circle cx="124" cy="98" r="7" fill="none" stroke="#fff" stroke-width="2.6"/>
  <path d="M129,103 l14,14 M139,113 l4,-4 M143,117 l4,-4" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>

  <!-- sparkles -->
  <path d="M164,34 L166,40 L172,42 L166,44 L164,50 L162,44 L156,42 L162,40 Z" fill="#FFC93C" opacity="0.85"/>
  <circle cx="24" cy="36" r="3.4" fill="#FF3D77" opacity="0.7"/>
  <circle cx="28" cy="130" r="2.6" fill="#4C6CF7" opacity="0.6"/>
</svg>
