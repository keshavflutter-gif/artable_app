<svg viewBox="0 0 240 140" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <linearGradient id="skylineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B3DFF"/>
      <stop offset="100%" stop-color="#4C6CF7"/>
    </linearGradient>
    <linearGradient id="spotGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFD166" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFD166" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <ellipse cx="120" cy="132" rx="112" ry="7" fill="#4C6CF7" opacity="0.10"/>

  <!-- spotlight beam behind performer -->
  <polygon points="128,10 96,132 160,132" fill="url(#spotGrad)"/>

  <g fill="url(#skylineGrad)" opacity="0.88">
    <rect x="8" y="76" width="24" height="56"/>
    <rect x="36" y="54" width="22" height="78"/>
    <rect x="62" y="90" width="18" height="42"/>
    <rect x="160" y="64" width="22" height="68"/>
    <rect x="186" y="92" width="18" height="40"/>
    <rect x="208" y="42" width="18" height="90"/>
  </g>
  <g fill="#fff" opacity="0.5">
    <rect x="12" y="82" width="4" height="4"/><rect x="20" y="90" width="4" height="4"/>
    <rect x="40" y="60" width="4" height="4"/><rect x="48" y="70" width="4" height="4"/>
    <rect x="164" y="72" width="4" height="4"/><rect x="212" y="50" width="4" height="4"/>
  </g>

  <!-- performer silhouette on peak -->
  <polygon points="104,132 128,48 152,132" fill="#5B4B8A"/>
  <circle cx="128" cy="34" r="9" fill="#5B4B8A"/>
  <path d="M120,44 q8,-6 16,0" stroke="#5B4B8A" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M118,50 l-8,-6 M138,50 l8,-6" stroke="#5B4B8A" stroke-width="3" stroke-linecap="round"/>

  <!-- ring flash -->
  <circle cx="128" cy="20" r="9" fill="none" stroke="#FF3D77" stroke-width="2.4"/>
  <line x1="120" y1="6" x2="136" y2="6" stroke="#FF3D77" stroke-width="2.4"/>

  <!-- camera -->
  <g transform="translate(20,110)">
    <rect x="0" y="10" width="46" height="32" rx="7" fill="#fff" stroke="url(#skylineGrad)" stroke-width="2.6"/>
    <rect x="12" y="2" width="18" height="10" rx="3" fill="url(#skylineGrad)"/>
    <circle cx="23" cy="26" r="9" fill="none" stroke="url(#skylineGrad)" stroke-width="2.6"/>
    <circle cx="23" cy="26" r="4" fill="url(#skylineGrad)" opacity="0.5"/>
  </g>

  <!-- microphone -->
  <g transform="translate(178,102)">
    <rect x="10" y="0" width="16" height="26" rx="8" fill="url(#skylineGrad)"/>
    <path d="M0,18 a18,18 0 0 0 36,0" fill="none" stroke="url(#skylineGrad)" stroke-width="3" stroke-linecap="round"/>
    <line x1="18" y1="36" x2="18" y2="44" stroke="url(#skylineGrad)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- music notes -->
  <g fill="#FFC93C">
    <circle cx="60" cy="40" r="4.4"/>
    <line x1="64" y1="40" x2="64" y2="10" stroke="#FFC93C" stroke-width="2.6"/>
    <path d="M64,10 q10,-2 12,6" stroke="#FFC93C" stroke-width="2.6" fill="none"/>
  </g>
  <g fill="#FF6FA5" opacity="0.9">
    <circle cx="192" cy="30" r="3.6"/>
    <line x1="195" y1="30" x2="195" y2="8" stroke="#FF6FA5" stroke-width="2.2"/>
  </g>

  <!-- confetti / stars -->
  <path d="M76,20 L78,26 L84,28 L78,30 L76,36 L74,30 L68,28 L74,26 Z" fill="#8B3DFF" opacity="0.7"/>
  <circle cx="200" cy="112" r="2.4" fill="#FF3D77" opacity="0.6"/>
  <circle cx="14" cy="60" r="2.2" fill="#FFC93C" opacity="0.7"/>
</svg>
