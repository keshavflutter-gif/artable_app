<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Artable — Search Results</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="device-wrap">
    <div class="device-frame">
      <div class="app-screen app-shell">

        <div class="screen-scroll app-scroll">

          <header class="app-header" style="padding-bottom:0;">
            <div class="top-row" style="margin-bottom:0;">
              <button class="back-btn" type="button" onclick="history.back()" aria-label="Go back">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
              </button>
            </div>
            <div class="app-header__greeting" style="text-align:center; flex:1;">
              <p class="greeting-name" style="font-size:17px;">Search Results</p>
            </div>
            <span style="width:40px;"></span>
          </header>

          <form class="search-bar" id="searchResultsForm">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="searchInput" placeholder="Search users, videos, challenges...">
          </form>

          <div class="app-content">

            <div class="tab-row results-tab-row" style="margin-top:16px;">
              <button class="tab-btn active" type="button" data-tab="all">All</button>
              <button class="tab-btn" type="button" data-tab="users">Users</button>
              <button class="tab-btn" type="button" data-tab="videos">Videos</button>
              <button class="tab-btn" type="button" data-tab="challenges">Challenges</button>
              <button class="tab-btn" type="button" data-tab="categories">Categories</button>
            </div>

            <div class="results-list" id="resultsList"></div>
            <p class="empty-note hidden" id="resultsEmpty">No results found. Try a different search.</p>

          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    hydrateSearchResults();
  </script>
</body>
</html>
