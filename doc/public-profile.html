<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Artable — Profile</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="device-wrap">
    <div class="device-frame">
      <div class="app-screen app-shell">

        <div class="screen-scroll app-scroll">

          <div class="profile-cover-wrap">
            <div class="profile-cover">
              <img data-field="coverUrl" src="" alt="Cover" onerror="imgFallback(this)">
              <div class="top-row" style="position:absolute; top:16px; left:16px; right:16px; margin:0; z-index:1;">
                <button class="back-btn" type="button" onclick="history.back()" aria-label="Go back">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
                </button>
              </div>
            </div>
            <img class="profile-header__avatar" data-field="avatarUrl" src="" alt="Avatar" onerror="imgFallback(this)">
          </div>

          <div class="app-content">

            <div class="profile-header">
              <div class="profile-header__name-row">
                <span class="profile-header__name" data-field="name"></span>
                <span id="verifiedBadgeSlot"></span>
                <span id="primeBadgeSlot"></span>
              </div>
              <span class="profile-header__handle" data-field="handle"></span>
              <p class="profile-header__bio" data-field="bio"></p>
              <span class="profile-header__category" data-field="category"></span>
            </div>

            <div class="profile-stats-grid">
              <div class="profile-stat"><strong data-field="videos"></strong><span>Videos</span></div>
              <div class="profile-stat"><strong data-field="likes"></strong><span>Likes</span></div>
              <div class="profile-stat"><strong data-field="talentScore"></strong><span>Talent Score</span></div>
              <div class="profile-stat"><strong data-field="challengesWon"></strong><span>Won</span></div>
            </div>

            <div class="profile-actions-row">
              <button class="btn-gradient follow-profile-btn" type="button" id="followProfileBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="16" y1="11" x2="22" y2="11"/></svg>
                <span>Follow</span>
              </button>
              <button class="btn-secondary-outline" type="button" id="shareProfileBtn" style="flex:none; width:52px;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="10.6" x2="15.4" y2="6.4"/><line x1="8.6" y1="13.4" x2="15.4" y2="17.6"/></svg>
              </button>
            </div>

            <div class="detail-section" style="margin-top:22px;">
              <h3>Top Performing Video</h3>
              <div id="topVideoCard"></div>
            </div>

            <div class="profile-section-title">
              <h3>Videos</h3>
            </div>
            <div class="reel-scroll" id="publicVideoGrid"></div>

            <div class="profile-section-title">
              <h3>Achievements</h3>
            </div>
            <div class="badges-preview-row" id="badgesPreview"></div>

          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    hydratePublicProfile();
  </script>
</body>
</html>
