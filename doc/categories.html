<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Artable — Challenge Categories</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="device-wrap">
    <div class="device-frame">
      <div class="app-screen app-shell">

        <div class="screen-scroll app-scroll">

          <header class="app-header">
            <div class="top-row" style="margin-bottom:0;">
              <button class="back-btn" type="button" onclick="window.location.href='home.html'" aria-label="Go back">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
              </button>
            </div>
            <div class="app-header__greeting" style="text-align:center; flex:1;">
              <p class="greeting-name" style="font-size:17px;">Challenge Categories</p>
            </div>
            <span style="width:40px;"></span>
          </header>

          <div class="search-bar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" placeholder="Search categories...">
          </div>

          <div class="app-content">
            <div class="category-hero">
              <div class="category-hero__glow category-hero__glow--1"></div>
              <div class="category-hero__glow category-hero__glow--2"></div>
              <div class="category-hero__glow category-hero__glow--3"></div>

              <div class="category-hero__content">
                <h2>Explore Talent Challenges</h2>
                <p>Find competitions by category and discover trending talent spaces.</p>
                <div class="category-hero__stats">
                  <span class="stat-chip-inline">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>
                    <span class="stat-chip-inline__value" id="categoryCountLabel">9</span>
                    <span class="stat-chip-inline__label">Categories</span>
                  </span>
                  <span class="stat-chip-inline">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2c1 4-3 5-3 9a3 3 0 0 0 6 0c0-1.5-1-2-1-3.5 2 1 3 3.5 3 5.5a5 5 0 0 1-10 0C7 8 10 6 12 2Z"/></svg>
                    <span class="stat-chip-inline__value">120+</span>
                    <span class="stat-chip-inline__label">Active</span>
                  </span>
                  <span class="stat-chip-inline">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>
                    <span class="stat-chip-inline__value">Daily</span>
                    <span class="stat-chip-inline__label">Updated</span>
                  </span>
                </div>
              </div>
            </div>

            <div class="section-header"><h2>All Categories</h2></div>
            <p class="section-subtitle">Browse by Talent Type</p>
            <div class="category-grid" id="categoryGrid"></div>
          </div>
        </div>

        <nav class="bottom-nav">
          <a class="bottom-nav__item" data-page="home.html" href="home.html">
            <span class="bottom-nav__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg></span>
            <span>Home</span>
          </a>
          <a class="bottom-nav__item" data-page="categories.html" href="categories.html">
            <span class="bottom-nav__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg></span>
            <span>Categories</span>
          </a>
          <a class="bottom-nav__item bottom-nav__item--upload" data-page="submit-entry.html" href="submit-entry.html">
            <span class="bottom-nav__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></span>
            <span>Upload</span>
          </a>
          <a class="bottom-nav__item" data-page="challenges.html" href="challenges.html">
            <span class="bottom-nav__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8v4a4 4 0 0 1-8 0V4Z"/><path d="M8 5H5a3 3 0 0 0 3 5M16 5h3a3 3 0 0 1-3 5M10 15h4v3h-4zM8 21h8"/></svg></span>
            <span>Challenges</span>
          </a>
          <a class="bottom-nav__item" data-page="profile.html" href="#" onclick="return comingSoon(event)">
            <span class="bottom-nav__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg></span>
            <span>Profile</span>
          </a>
        </nav>

      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.getElementById('categoryCountLabel').textContent = CATEGORIES.length;
    document.getElementById('categoryGrid').innerHTML = CATEGORIES.map(categoryCardHtml).join('');
  </script>
</body>
</html>
