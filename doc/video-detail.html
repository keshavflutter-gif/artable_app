<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Artable — Video</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="device-wrap">
    <div class="device-frame">
      <div class="app-screen app-shell">

        <div class="screen-scroll app-scroll">

          <header class="app-header">
            <div class="top-row" style="margin-bottom:0;">
              <button class="back-btn" type="button" onclick="history.back()" aria-label="Go back">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
              </button>
            </div>
            <div class="app-header__greeting" style="text-align:center; flex:1;">
              <p class="greeting-name" style="font-size:17px;">Reel</p>
            </div>
            <span style="width:40px;"></span>
          </header>

          <div class="app-content">

            <div class="detail-video-stage" id="detailVideoStage">
              <span class="detail-video-stage__category" data-field="reelCategory"></span>
              <img data-field="reelPoster" src="" alt="Reel video">
              <button class="detail-video-stage__play" type="button" id="detailPlayBtn" aria-label="Play video">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
              </button>
            </div>

            <div class="detail-creator-card">
              <div id="creatorInfoRow"></div>
            </div>

            <p class="detail-caption" data-field="reelCaption"></p>

            <div class="detail-stat-row">
              <div class="detail-stat">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                <strong data-field="reelViews"></strong>
                <span>Views</span>
              </div>
              <div class="detail-stat">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z"/></svg>
                <strong data-field="reelLikes"></strong>
                <span>Likes</span>
              </div>
              <button class="detail-stat" type="button" id="detailCommentBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.4 8.4 0 0 1-8.9 8.4 8.6 8.6 0 0 1-3.5-.7L3 21l1.8-5.4A8.4 8.4 0 0 1 3.6 11.5 8.4 8.4 0 0 1 12 3a8.4 8.4 0 0 1 9 8.5Z"/></svg>
                <strong data-field="reelComments"></strong>
                <span>Comments</span>
              </button>
              <button class="detail-stat" type="button" id="detailShareBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="10.6" x2="15.4" y2="6.4"/><line x1="8.6" y1="13.4" x2="15.4" y2="17.6"/></svg>
                <strong data-field="reelShares"></strong>
                <span>Shares</span>
              </button>
            </div>

            <div class="talent-score-badge">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 15 9 22 9.3 16.6 14 18.2 21 12 17.3 5.8 21 7.4 14 2 9.3 9 9 Z"/></svg>
              <strong data-field="reelTalentScore"></strong>
              <span>Avg. Talent Score</span>
            </div>

            <div class="detail-cta-row">
              <button class="btn-gradient" type="button" id="rateThisTalentBtn">
                <span>Rate This Talent</span>
              </button>
            </div>
            <div class="detail-cta-row" style="margin-top:10px;">
              <button class="btn-secondary-outline" type="button" id="viewChallengeBtn" style="width:100%;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8v4a4 4 0 0 1-8 0V4Z"/><path d="M8 5H5a3 3 0 0 0 3 5M16 5h3a3 3 0 0 1-3 5M10 15h4v3h-4zM8 21h8"/></svg>
                <span data-field="reelChallengeName"></span>
              </button>
            </div>

            <div class="detail-section" style="margin-top:26px;">
              <h3>More Reels</h3>
              <div class="reel-scroll" id="relatedReels"></div>
            </div>

          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    hydrateVideoDetail();
  </script>
</body>
</html>
