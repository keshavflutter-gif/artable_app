<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Artable — Vouchers</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="device-wrap">
    <div class="device-frame">
      <div class="app-screen app-shell">

        <div class="screen-scroll app-scroll">

          <header class="app-header" style="padding-bottom:0;">
            <div class="top-row" style="margin-bottom:0;">
              <button class="back-btn" type="button" onclick="history.back()" aria-label="Go back">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
              </button>
            </div>
            <div class="app-header__greeting" style="text-align:center; flex:1;">
              <p class="greeting-name" style="font-size:17px;">Vouchers</p>
            </div>
            <span style="width:40px;"></span>
          </header>

          <div class="app-content">

            <div class="reward-balance-card">
              <div class="reward-balance-card__col">
                <strong data-field="voucherAvailableCount"></strong>
                <span>Available Vouchers</span>
              </div>
              <div class="reward-balance-card__divider"></div>
              <div class="reward-balance-card__col">
                <strong data-field="voucherClaimedCount"></strong>
                <span>Claimed Vouchers</span>
              </div>
            </div>

            <div class="rewards-tab-row" style="margin-top:16px;">
              <a class="tab-btn" href="rewards.html" style="text-decoration:none;">All</a>
              <a class="tab-btn" href="cash-rewards.html" style="text-decoration:none;">Cash</a>
              <span class="tab-btn active">Vouchers</span>
              <a class="tab-btn" href="product-rewards.html" style="text-decoration:none;">Products</a>
              <a class="tab-btn" href="sponsor-rewards.html" style="text-decoration:none;">Sponsor</a>
            </div>

            <div class="profile-section-title" style="margin-top:20px;">
              <h3>Gift Vouchers</h3>
            </div>
            <div class="voucher-reward-grid" id="voucherRewardsGrid"></div>

          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    hydrateVoucherRewards();
  </script>
</body>
</html>
