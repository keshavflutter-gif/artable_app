<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Artable — Recording</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="device-wrap">
    <div class="device-frame">
      <div class="app-screen app-shell">

        <div class="screen-scroll app-scroll">
          <div class="camera-stage" id="cameraStage">
            <img class="camera-stage__bg" src="https://images.unsplash.com/photo-1598963561591-3a14d9ba6a7b?w=800&h=1400&q=80&auto=format&fit=crop&crop=faces,entropy" alt="Camera preview placeholder" onerror="imgFallback(this)">
            <div class="camera-stage__scrim"></div>

            <div class="camera-top-controls">
              <button class="camera-ctrl-btn" type="button" onclick="history.back()" aria-label="Go back">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
              </button>
              <span class="studio-panel-title" style="position:relative; bottom:auto;">Artable Studio</span>
              <span style="width:38px;"></span>
            </div>

            <div class="camera-timer-wrap">
              <span class="camera-rec-dot"></span>
              <span class="camera-timer" id="cameraTimer">00:00</span>
            </div>

            <div class="camera-control-row">
              <button class="camera-control-item" type="button" id="switchCameraBtn">
                <span class="camera-control-item__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 15a8 8 0 0 1-14.3 4.9M4 9a8 8 0 0 1 14.3-4.9"/><polyline points="4 4 4 9 9 9"/><polyline points="20 20 20 15 15 15"/></svg></span>
                <span class="camera-control-item__label">Flip</span>
              </button>
              <button class="camera-control-item" type="button" id="flashBtn">
                <span class="camera-control-item__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 8.5 8.7M4 14h6l-1 8 3.6-4.8M18 8.7 20 6h-6l.6-4M2 2l20 20"/></svg></span>
                <span class="camera-control-item__label">Flash</span>
              </button>
              <button class="camera-control-item" type="button" id="timerBtn">
                <span class="camera-control-item__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/></svg></span>
                <span class="camera-control-item__label">Timer</span>
              </button>
              <button class="camera-control-item" type="button" id="cameraEffectsBtn">
                <span class="camera-control-item__icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 13.8 9 21 12l-7.2 3L12 22l-1.8-7L3 12l7.2-3Z"/></svg></span>
                <span class="camera-control-item__label">Filters</span>
              </button>
              <button class="camera-control-item" type="button" id="speedBtn">
                <span class="camera-control-item__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z"/></svg></span>
                <span class="camera-control-item__label" id="speedBtnLabel">1x</span>
              </button>
              <button class="camera-control-item" type="button" id="cameraMusicBtn">
                <span class="camera-control-item__icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg></span>
                <span class="camera-control-item__label">Music</span>
              </button>
            </div>

            <div class="camera-bottom-controls">
              <button class="camera-side-btn hidden" type="button" id="retakeBtn" aria-label="Retake">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.5 15a9 9 0 1 0 2-9.4L1 10"/></svg>
              </button>

              <button class="camera-record-btn" type="button" id="recordBtn" aria-label="Record">
                <svg class="camera-record-ring" viewBox="0 0 100 100">
                  <defs>
                    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                      <stop offset="0%" stop-color="#FF3D77"/>
                      <stop offset="100%" stop-color="#8B3DFF"/>
                    </linearGradient>
                  </defs>
                  <circle cx="50" cy="50" r="42" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="5"/>
                  <circle id="cameraProgressRing" cx="50" cy="50" r="42" fill="none" stroke="url(#ringGrad)" stroke-width="5" stroke-linecap="round" stroke-dasharray="264" stroke-dashoffset="264"/>
                </svg>
                <span class="camera-record-btn__core"></span>
              </button>

              <a class="camera-side-btn camera-side-btn--next hidden" id="nextToPreviewBtn" href="#" aria-label="Done">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
              </a>
            </div>

            <p class="camera-max-note">Max 60 seconds</p>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    hydrateStudioCamera();
  </script>
</body>
</html>
