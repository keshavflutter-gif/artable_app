<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Artable — Forgot Password</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="device-wrap">
    <div class="device-frame">
      <div class="app-screen">
        <div class="bg-decoration">
          <img class="bg-frame" src="assets/bg-frame-3.png" alt="">
        </div>

        <div class="screen-scroll">

          <div class="top-row">
            <button class="back-btn" type="button" onclick="window.location.href='login.html'" aria-label="Go back">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
            </button>
          </div>

          <div class="logo-header icon-only">
            <div class="logo-mark"><img src="assets/logo.svg" alt="Artable logo"></div>
          </div>

          <h2 class="screen-title">Forgot Password?</h2>
          <p class="screen-subtitle">Enter your email address to receive reset instructions</p>

          <form id="forgotForm" novalidate>
            <div class="field-group">
              <div class="auth-input">
                <span class="field-icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 6 12 13 2 6"/><path d="M2 6h20v12H2z"/></svg>
                </span>
                <input id="resetEmail" type="email" placeholder="Email Address" autocomplete="email" required>
              </div>
            </div>

            <button class="btn-gradient" type="submit" style="margin-top:8px;">
              SEND RESET LINK
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
            </button>
          </form>

          <p class="footer-row">Remembered it? <a href="login.html">Back to Login</a></p>
        </div>
      </div>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script>
    document.getElementById('forgotForm').addEventListener('submit', (e) => {
      e.preventDefault();
      // TODO(api): call forgot-password endpoint with the email, then
      // route to OTP verification (or show "check your email" state).
      window.location.href = 'otp-verification.html';
    });
  </script>
</body>
</html>
