<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Artable — Sign Up</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="device-wrap">
    <div class="device-frame">
      <div class="app-screen">
        <div class="bg-decoration">
          <img class="bg-frame" src="assets/bg-frame-1.png" alt="">
        </div>

        <div class="screen-scroll">

          <div class="top-row">
            <button class="back-btn" type="button" onclick="window.location.href='login.html'" aria-label="Go back">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
            </button>
          </div>

          <div class="logo-header compact">
            <div class="logo-mark"><img src="assets/logo.svg" alt="Artable logo"></div>
            <h1 class="app-name" data-app-name>ARTABLE</h1>
            <p class="app-tagline">Create • Showcase • Inspire</p>
          </div>

          <form id="signupForm" novalidate>
            <div class="field-group">
              <div class="auth-input">
                <span class="field-icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                </span>
                <input id="fullName" type="text" placeholder="Full Name" autocomplete="name" required>
              </div>
            </div>

            <div class="field-group">
              <div class="auth-input">
                <span class="field-icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 6 12 13 2 6"/><path d="M2 6h20v12H2z"/></svg>
                </span>
                <input id="signupEmail" type="email" placeholder="Email Address" autocomplete="email" required>
              </div>
            </div>

            <div class="field-group">
              <div class="auth-input">
                <span class="field-icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M7 10V7a5 5 0 0 1 10 0v3"/></svg>
                </span>
                <input id="signupPassword" type="password" placeholder="Password" autocomplete="new-password" required>
                <button type="button" class="field-toggle" data-toggle-for="signupPassword" aria-label="Show password">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </div>
            </div>

            <div class="field-group">
              <div class="auth-input">
                <span class="field-icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M7 10V7a5 5 0 0 1 10 0v3"/></svg>
                </span>
                <input id="confirmPassword" type="password" placeholder="Confirm Password" autocomplete="new-password" required>
                <button type="button" class="field-toggle" data-toggle-for="confirmPassword" aria-label="Show password">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </div>
            </div>

            <button class="btn-gradient" type="submit" style="margin-top:6px;">
              CREATE ACCOUNT
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
            </button>
          </form>

          <div class="divider-row">
            <span class="line"></span><span>OR CONTINUE WITH</span><span class="line"></span>
          </div>

          <div class="social-row">
            <button class="btn-social" type="button"><img src="assets/google.svg" alt="Google">Google</button>
            <button class="btn-social" type="button"><img src="assets/apple.svg" alt="Apple">Apple</button>
          </div>

          <p class="footer-row">Already a member? <a href="login.html">Log In</a></p>
        </div>
      </div>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script>
    document.getElementById('signupForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const pass = document.getElementById('signupPassword').value;
      const confirm = document.getElementById('confirmPassword').value;
      if (pass !== confirm) {
        showFieldHint('confirmPassword', 'Passwords do not match', 'error');
        return;
      }
      // TODO(api): call sign-up endpoint, then send the user to OTP
      // verification to confirm their mobile number/email.
      window.location.href = 'otp-verification.html';
    });
  </script>
</body>
</html>
