<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Artable — Rate This Talent</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="device-wrap">
    <div class="device-frame">
      <div class="app-screen app-shell rating-modal-screen">

        <div class="rating-modal-bg">
          <img class="rating-modal-bg__img" data-field="reelPoster" src="" alt="">
          <div class="rating-modal-bg__scrim"></div>
        </div>

        <div class="rating-sheet-overlay" onclick="if(event.target===this) history.back()">

          <div class="rating-sheet" id="ratingFormSection">
            <span class="rating-sheet__handle"></span>
            <button class="rating-sheet__close" type="button" onclick="history.back()" aria-label="Close">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>

            <div class="rating-sheet__scroll">
              <div class="rating-sheet__header">
                <p class="rating-sheet__title">
                  <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 15 9 22 9.3 16.6 14 18.2 21 12 17.3 5.8 21 7.4 14 2 9.3 9 9 Z"/></svg>
                  RATE THIS TALENT
                </p>
                <p class="rating-sheet__subtitle">Your score helps real talent shine!</p>
              </div>

              <div class="rating-sheet__preview">
                <img class="rating-sheet__preview-img" data-field="reelPoster" src="" alt="Talent preview">
                <div class="rating-sheet__preview-scrim"></div>
                <div class="rating-sheet__preview-creator">
                  <img class="rating-sheet__preview-avatar" data-field="reelAvatar" src="" alt="">
                  <span data-field="reelHandle"></span>
                </div>
                <div class="rating-sheet__preview-stats">
                  <span class="rating-sheet__preview-stat">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7-4.35-9.8-9A5.5 5.5 0 0 1 12 5.5 5.5 5.5 0 0 1 21.8 12C19 16.65 12 21 12 21Z"/></svg>
                    <b data-field="reelLikes"></b>
                  </span>
                  <span class="rating-sheet__preview-stat">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5Z"/></svg>
                    <b data-field="reelComments"></b>
                  </span>
                  <span class="rating-sheet__preview-stat">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="10.6" x2="15.4" y2="6.4"/><line x1="8.6" y1="13.4" x2="15.4" y2="17.6"/></svg>
                    <b data-field="reelShares"></b>
                  </span>
                </div>
              </div>

              <div class="rating-sheet__impact">
                <span>Your Impact</span>
                <strong>🔥 <span data-field="ratingImpact"></span></strong>
              </div>

              <div class="rating-sheet__slider-block">
                <div class="rating-sheet__bubble" id="ratingBubble"><span id="ratingBubbleValue">5.0</span></div>
                <input class="rating-sheet__slider" type="range" id="ratingSlider" min="0" max="10" step="0.5" value="5">
                <div class="rating-sheet__ticks">
                  <span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span>10</span>
                </div>
              </div>

              <p class="rating-sheet__score-line">Your Score: <strong id="ratingScoreValue">5.0</strong>/10</p>
              <p class="rating-sheet__hint">0.5 step rating (Ex: 7.5, 8.0, 8.5, 9.0, 9.5)</p>

              <button class="btn-gradient rating-sheet__submit-btn" type="button" id="submitRatingBtn">
                <span>Submit Rating</span>
              </button>
              <p class="rating-sheet__footnote">Your rating helps decide the winner</p>
            </div>
          </div>

          <div class="rating-sheet rating-sheet--success hidden" id="ratingSuccessSection">
            <div class="rating-sheet__scroll rating-sheet__scroll--success">
              <div class="rating-sheet__success-badge" id="ratingSuccessScore"></div>
              <h2>Rating Submitted!</h2>
              <p>Thanks for helping decide this challenge's winner.</p>
              <button class="btn-gradient rating-sheet__submit-btn" type="button" id="ratingBackToFeedBtn">
                <span>Back to Reel</span>
              </button>
            </div>
          </div>

        </div>

      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    hydrateTalentRating();
  </script>
</body>
</html>
