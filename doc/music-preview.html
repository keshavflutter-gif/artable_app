<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Artable — Music Preview</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="device-wrap">
    <div class="device-frame">
      <div class="app-screen app-shell">

        <div class="screen-scroll app-scroll">

          <header class="app-header" style="padding-bottom:0;">
            <div class="top-row" style="margin-bottom:0;">
              <button class="back-btn" type="button" onclick="history.back()" aria-label="Go back">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
              </button>
            </div>
            <div class="app-header__greeting" style="text-align:center; flex:1;">
              <p class="greeting-name" style="font-size:17px;">Music Preview</p>
            </div>
            <span style="width:40px;"></span>
          </header>

          <div class="app-content">

            <div class="music-preview-cover">
              <div class="music-preview-cover__glow"></div>
              <img data-field="coverUrl" src="" alt="Track cover" onerror="imgFallback(this)">
            </div>
            <div class="music-preview-info">
              <strong data-field="title"></strong>
              <span data-field="artist"></span>
            </div>

            <div class="music-player-card">
              <div class="music-player-card__waveform" id="musicWaveform"></div>
              <div class="music-player-card__times">
                <span id="musicCurrentTime">0:00</span>
                <span data-field="duration"></span>
              </div>
              <div class="music-player-card__controls">
                <button class="music-player-card__play-btn" type="button" id="musicPlayBtn">
                  <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21"/></svg>
                </button>
              </div>
            </div>

            <div class="music-action-row">
              <button class="btn-gradient" type="button" id="useMusicBtn"><span>Use This Music</span></button>
              <button class="btn-secondary-outline" type="button" id="saveToLibraryBtn"></button>
            </div>

            <div class="profile-section-title" style="margin-top:22px;">
              <h3>Related Tracks</h3>
            </div>
            <div class="related-tracks-row" id="relatedTracks"></div>

          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    hydrateMusicPreview();
  </script>
</body>
</html>
