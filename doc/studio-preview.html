<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Artable — Preview</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="device-wrap">
    <div class="device-frame">
      <div class="app-screen app-shell">

        <div class="screen-scroll app-scroll">

          <header class="app-header">
            <div class="top-row" style="margin-bottom:0;">
              <button class="back-btn" type="button" onclick="history.back()" aria-label="Go back">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
              </button>
            </div>
            <div class="app-header__greeting" style="text-align:center; flex:1;">
              <p class="greeting-name" style="font-size:17px;">Preview</p>
            </div>
            <span style="width:40px;"></span>
          </header>

          <div class="app-content">

            <div class="video-preview-stage" id="previewStage">
              <img class="video-preview-stage__poster" id="previewPoster" src="" alt="Recorded video preview">
              <button class="video-preview-stage__play" type="button" id="previewPlayBtn" aria-label="Play preview">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
              </button>
              <span class="video-preview-stage__duration" id="previewDuration">0:00</span>
            </div>

            <div class="preview-music-info hidden" id="previewMusicInfo"></div>

            <div class="preview-actions">
              <button class="btn-secondary-outline" type="button" id="retakeFromPreviewBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.5 15a9 9 0 1 0 2-9.4L1 10"/></svg>
                <span>Retake</span>
              </button>
              <button class="btn-gradient" type="button" id="continueToDetailsBtn">
                <span>Next</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
              </button>
            </div>

            <button class="btn-secondary-outline" type="button" id="saveDraftBtn" style="width:100%; margin-top:10px;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
              <span>Save Draft</span>
            </button>

            <p class="preview-note">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
              <span>Review your entry before adding details.</span>
            </p>

          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    hydrateStudioPreview();
  </script>
</body>
</html>
