<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Artable — Challenge Arena</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="device-wrap">
    <div class="device-frame">
      <div class="app-screen app-shell">

        <div class="screen-scroll app-scroll reels-scroll-host">

          <div class="reels-feed-header">
            <span class="reels-feed-header__title">🏆 Challenge Arena</span>
            <div class="reels-feed-header__actions">
              <button class="reels-feed-header__icon-btn" type="button" onclick="return comingSoon(event)" aria-label="Search">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              </button>
              <button class="reels-feed-header__icon-btn" type="button" onclick="return comingSoon(event)" aria-label="Notifications">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
              </button>
            </div>
          </div>

          <div class="reels-scroll" id="reelsScroll"></div>

        </div>

        <nav class="bottom-nav">
          <a class="bottom-nav__item" data-page="home.html" href="home.html">
            <span class="bottom-nav__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg></span>
            <span>Home</span>
          </a>
          <a class="bottom-nav__item" data-page="challenges.html" href="challenges.html">
            <span class="bottom-nav__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8v4a4 4 0 0 1-8 0V4Z"/><path d="M8 5H5a3 3 0 0 0 3 5M16 5h3a3 3 0 0 1-3 5M10 15h4v3h-4zM8 21h8"/></svg></span>
            <span>Challenges</span>
          </a>
          <a class="bottom-nav__item bottom-nav__item--upload" data-page="submit-entry.html" href="submit-entry.html">
            <span class="bottom-nav__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></span>
            <span>Upload</span>
          </a>
          <a class="bottom-nav__item" data-page="activity.html" href="#" onclick="return comingSoon(event)">
            <span class="bottom-nav__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2 8 4-16 2 8h4"/></svg></span>
            <span>Activity</span>
          </a>
          <a class="bottom-nav__item" data-page="profile.html" href="#" onclick="return comingSoon(event)">
            <span class="bottom-nav__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg></span>
            <span>Profile</span>
          </a>
        </nav>

        <!-- ===== In-page bottom rating panel — opens over the reel, does
             not navigate away, so the video/reel stays visible behind it. ===== -->
        <div class="reel-rating-overlay hidden" id="reelRatingOverlay">
          <div class="reel-rating-panel" id="reelRatingPanel">
            <span class="reel-rating-panel__handle"></span>
            <button class="reel-rating-panel__close" type="button" id="reelRatingCloseBtn" aria-label="Close">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>

            <div id="reelRatingForm">
              <div class="reel-rating-panel__header">
                <div class="reel-rating-panel__header-text">
                  <p class="reel-rating-panel__title">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 15 9 22 9.3 16.6 14 18.2 21 12 17.3 5.8 21 7.4 14 2 9.3 9 9 Z"/></svg>
                    RATE THIS TALENT
                  </p>
                  <p class="reel-rating-panel__subtitle">Your score helps real talent shine!</p>
                </div>
                <div class="reel-rating-panel__impact">
                  <span>Your Impact</span>
                  <strong>🔥 <span id="reelRatingImpact"></span></strong>
                </div>
              </div>

              <div class="reel-rating-panel__slider-block">
                <div class="reel-rating-panel__bubble" id="reelRatingBubble"><span id="reelRatingBubbleValue">5.0</span></div>
                <input class="reel-rating-panel__slider" type="range" id="reelRatingSlider" min="0" max="10" step="0.5" value="5">
                <div class="reel-rating-panel__ticks">
                  <span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span>10</span>
                </div>
              </div>

              <p class="reel-rating-panel__score-line">Your Score: <strong id="reelRatingScoreValue">5.0</strong>/10</p>
              <p class="reel-rating-panel__hint">0.5 step rating (Ex: 7.5, 8.0, 8.5, 9.0, 9.5)</p>

              <button class="btn-gradient reel-rating-panel__submit-btn" type="button" id="reelRatingSubmitBtn">
                <span>Submit Rating</span>
              </button>
            </div>

            <div id="reelRatingSuccess" class="reel-rating-panel__success hidden">
              <div class="reel-rating-panel__success-badge" id="reelRatingSuccessScore"></div>
              <p>Thanks for helping decide this challenge's winner.</p>
              <button class="btn-gradient reel-rating-panel__submit-btn" type="button" id="reelRatingDoneBtn">
                <span>Done</span>
              </button>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    hydrateReelsFeed();
  </script>
</body>
</html>
