<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Artable — My Profile</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="device-wrap">
    <div class="device-frame">
      <div class="app-screen app-shell">

        <div class="screen-scroll app-scroll" style="padding-bottom:86px;">

          <div class="profile-cover-wrap">
            <div class="profile-cover">
              <img data-field="coverUrl" src="" alt="Cover" onerror="imgFallback(this)">
            </div>
            <img class="profile-header__avatar" data-field="avatarUrl" src="" alt="Avatar" onerror="imgFallback(this)">
          </div>

          <div class="app-content">

            <div class="profile-header">
              <div class="profile-header__name-row">
                <span class="profile-header__name" data-field="name"></span>
                <span id="primeBadgeSlot"></span>
              </div>
              <span class="profile-header__handle" data-field="handle"></span>
              <p class="profile-header__bio" data-field="bio"></p>
              <span class="profile-header__category" data-field="category"></span>
              <div class="social-links-row" id="socialLinks"></div>
            </div>

            <div class="profile-stats-grid">
              <div class="profile-stat"><strong data-field="videos"></strong><span>Videos</span></div>
              <div class="profile-stat"><strong data-field="likes"></strong><span>Likes</span></div>
              <div class="profile-stat"><strong data-field="talentScore"></strong><span>Talent Score</span></div>
              <div class="profile-stat"><strong data-field="challengesWon"></strong><span>Won</span></div>
            </div>

            <div class="profile-actions-row">
              <a class="btn-gradient" href="edit-profile.html">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
                <span>Edit Profile</span>
              </a>
            </div>

            <div class="profile-quick-links">
              <a class="profile-quick-link" href="#" onclick="return comingSoon(event)">
                <span class="profile-quick-link__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12V7a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5Z"/><path d="M17 12h.01"/><path d="M12 12h5v5h-5a2.5 2.5 0 0 1 0-5Z"/></svg></span>
                <span>Wallet</span>
              </a>
              <a class="profile-quick-link" href="talent-score.html">
                <span class="profile-quick-link__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M11 20V4M18 20v-7"/><path d="M3 20h18"/></svg></span>
                <span>Stats</span>
              </a>
              <a class="profile-quick-link" href="#" onclick="return comingSoon(event)">
                <span class="profile-quick-link__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.6V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.6 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.6 1Z"/></svg></span>
                <span>Settings</span>
              </a>
            </div>

            <div class="profile-tab-row">
              <span class="is-current">Videos</span>
              <a href="achievements.html">Achievements</a>
              <a href="talent-score.html">Stats</a>
            </div>

            <div class="profile-section-title">
              <h3>Recent Videos</h3>
              <a href="my-videos.html">See All</a>
            </div>
            <div class="recent-videos-grid" id="recentVideosGrid"></div>

            <div class="profile-section-title">
              <h3>Badges</h3>
              <a href="achievements.html">See All</a>
            </div>
            <div class="badges-preview-row" id="badgesPreview"></div>

          </div>
        </div>

        <nav class="bottom-nav">
          <a class="bottom-nav__item" data-page="home.html" href="home.html">
            <span class="bottom-nav__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg></span>
            <span>Home</span>
          </a>
          <a class="bottom-nav__item" data-page="challenges.html" href="challenges.html">
            <span class="bottom-nav__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8v4a4 4 0 0 1-8 0V4Z"/><path d="M8 5H5a3 3 0 0 0 3 5M16 5h3a3 3 0 0 1-3 5M10 15h4v3h-4zM8 21h8"/></svg></span>
            <span>Challenges</span>
          </a>
          <a class="bottom-nav__item bottom-nav__item--upload" data-page="submit-entry.html" href="submit-entry.html">
            <span class="bottom-nav__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></span>
            <span>Upload</span>
          </a>
          <a class="bottom-nav__item" data-page="activity.html" href="#" onclick="return comingSoon(event)">
            <span class="bottom-nav__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2 8 4-16 2 8h4"/></svg></span>
            <span>Activity</span>
          </a>
          <a class="bottom-nav__item active" data-page="my-profile.html" href="my-profile.html">
            <span class="bottom-nav__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg></span>
            <span>Profile</span>
          </a>
        </nav>

      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    hydrateMyProfile();
    initBottomNav();
  </script>
</body>
</html>
