<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Artable — Share &amp; Report</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="device-wrap">
    <div class="device-frame">
      <div class="app-screen app-shell">

        <div class="screen-scroll app-scroll">

          <header class="app-header">
            <div class="top-row" style="margin-bottom:0;">
              <button class="back-btn" type="button" onclick="history.back()" aria-label="Go back">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
              </button>
            </div>
            <div class="app-header__greeting" style="text-align:center; flex:1;">
              <p class="greeting-name" style="font-size:17px;">Share &amp; Report</p>
            </div>
            <span style="width:40px;"></span>
          </header>

          <div class="app-content">

            <div class="detail-section" style="margin-top:4px;">
              <h3>Share</h3>
              <div class="share-options-grid" id="shareOptionsGrid"></div>
            </div>

            <div class="detail-section">
              <h3>Report</h3>
              <div class="report-reason-list" id="reportReasonList"></div>
              <button class="btn-secondary-outline" type="button" id="submitReportBtn" style="width:100%; margin-top:16px;" disabled>
                <span>Submit Report</span>
              </button>
              <div class="report-confirm-note hidden" id="reportConfirmNote">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                <span>Thanks — our team will review this report.</span>
              </div>
            </div>

          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    hydrateShareReport();
  </script>
</body>
</html>
