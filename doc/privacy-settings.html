<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Artable — Privacy Settings</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="device-wrap">
    <div class="device-frame">
      <div class="app-screen app-shell">

        <div class="screen-scroll app-scroll">

          <header class="app-header" style="padding-bottom:0;">
            <div class="top-row" style="margin-bottom:0;">
              <button class="back-btn" type="button" onclick="history.back()" aria-label="Go back">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
              </button>
            </div>
            <div class="app-header__greeting" style="text-align:center; flex:1;">
              <p class="greeting-name" style="font-size:17px;">Privacy Settings</p>
            </div>
            <span style="width:40px;"></span>
          </header>

          <div class="app-content">

            <div class="info-note-card" style="margin-top:16px;">
              <span class="info-note-card__icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 5v6c0 5 3.4 8.7 8 11 4.6-2.3 8-6 8-11V5l-8-3Z"/></svg>
              </span>
              <div class="info-note-card__text">
                <strong>Stay in control</strong>
                <span>Control who can view and interact with your profile.</span>
              </div>
            </div>

            <div class="visibility-card">
              <p class="visibility-card__title">Profile Visibility</p>
              <div class="visibility-toggle tab-row">
                <button class="tab-btn" type="button" data-visibility="public">Public</button>
                <button class="tab-btn" type="button" data-visibility="private">Private</button>
              </div>
            </div>

            <div class="profile-section-title" style="margin-top:20px;">
              <h3>Profile Controls</h3>
            </div>
            <div class="privacy-options-list" id="privacyOptionsList"></div>

            <a class="blocked-users-row" href="#" onclick="return comingSoon(event)">
              <span class="blocked-users-row__icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><line x1="7" y1="7" x2="17" y2="17"/></svg>
              </span>
              <span class="blocked-users-row__body">
                <strong>Blocked Users</strong>
                <span><span data-field="blockedUsersCount"></span> blocked</span>
              </span>
              <span class="blocked-users-row__chevron"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg></span>
            </a>

            <div class="info-note-card" style="margin-top:18px;">
              <span class="info-note-card__icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>
              </span>
              <div class="info-note-card__text">
                <span>Some information may remain visible for challenge participation and winner announcements.</span>
              </div>
            </div>

          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    hydratePrivacySettings();
  </script>
</body>
</html>
