<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Artable — Invite Friends</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="device-wrap">
    <div class="device-frame">
      <div class="app-screen app-shell">

        <div class="screen-scroll app-scroll">

          <header class="app-header" style="padding-bottom:0;">
            <div class="top-row" style="margin-bottom:0;">
              <button class="back-btn" type="button" onclick="history.back()" aria-label="Go back">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
              </button>
            </div>
            <div class="app-header__greeting" style="text-align:center; flex:1;">
              <p class="greeting-name" style="font-size:17px;">Invite Friends</p>
            </div>
            <span style="width:40px;"></span>
          </header>

          <div class="app-content">

            <div class="referral-code-card">
              <span class="referral-code-card__label">Your Referral Code</span>
              <div class="referral-code-card__value">
                <span id="referralCodeValue"></span>
              </div>
              <button class="referral-code-card__copy-btn" type="button" id="copyReferralCodeBtn"></button>
            </div>

            <div class="profile-section-title" style="margin-top:22px;">
              <h3>Invite via</h3>
            </div>
            <div class="referral-invite-grid" id="inviteShareGrid"></div>

            <div class="info-note-card" style="margin-top:20px;">
              <span class="info-note-card__icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7 12 13 4 7"/><rect x="3" y="5" width="18" height="14" rx="2"/></svg>
              </span>
              <div class="info-note-card__text">
                <strong>Earn rewards for every friend</strong>
                <span>You and your friend both get rewarded when they join and complete their first challenge.</span>
              </div>
            </div>

            <button class="btn-gradient" type="button" id="shareInviteLinkBtn" style="margin-top:20px;">
              <span>Track My Referrals</span>
            </button>

          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    hydrateInviteFriends();
  </script>
</body>
</html>
