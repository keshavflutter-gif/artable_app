<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Artable — Rewards</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="device-wrap">
    <div class="device-frame">
      <div class="app-screen app-shell">

        <div class="screen-scroll app-scroll">

          <header class="app-header" style="padding-bottom:0;">
            <div class="top-row" style="margin-bottom:0;">
              <button class="back-btn" type="button" onclick="history.back()" aria-label="Go back">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
              </button>
            </div>
            <div class="app-header__greeting" style="text-align:center; flex:1;">
              <p class="greeting-name" style="font-size:17px;">Rewards</p>
            </div>
            <a href="wallet.html" class="back-btn" aria-label="Go to wallet">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12V7a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5Z"/><path d="M17 12h.01"/><path d="M12 12h5v5h-5a2.5 2.5 0 0 1 0-5Z"/></svg>
            </a>
          </header>

          <div class="app-content">

            <div class="reward-balance-card">
              <div class="reward-balance-card__col">
                <strong data-field="availableBalance"></strong>
                <span>Available Rewards</span>
              </div>
              <div class="reward-balance-card__divider"></div>
              <div class="reward-balance-card__col">
                <strong data-field="totalEarned"></strong>
                <span>Total Earned</span>
              </div>
            </div>

            <div class="rewards-tab-row">
              <button class="tab-btn active" type="button" data-tab="all">All</button>
              <a class="tab-btn" href="cash-rewards.html" style="text-decoration:none;">Cash</a>
              <a class="tab-btn" href="voucher-rewards.html" style="text-decoration:none;">Vouchers</a>
              <a class="tab-btn" href="product-rewards.html" style="text-decoration:none;">Products</a>
              <a class="tab-btn" href="sponsor-rewards.html" style="text-decoration:none;">Sponsor</a>
            </div>

            <div id="featuredReward"></div>

            <div class="profile-section-title" style="margin-top:20px;">
              <h3>All Rewards</h3>
              <a href="transaction-history.html">History</a>
            </div>
            <div class="rewards-grid" id="rewardsGrid"></div>

          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    hydrateRewards();
  </script>
</body>
</html>
