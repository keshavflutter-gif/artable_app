<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Artable — Referral Tracking</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="device-wrap">
    <div class="device-frame">
      <div class="app-screen app-shell">

        <div class="screen-scroll app-scroll">

          <header class="app-header" style="padding-bottom:0;">
            <div class="top-row" style="margin-bottom:0;">
              <button class="back-btn" type="button" onclick="history.back()" aria-label="Go back">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
              </button>
            </div>
            <div class="app-header__greeting" style="text-align:center; flex:1;">
              <p class="greeting-name" style="font-size:17px;">Referral Tracking</p>
            </div>
            <span style="width:40px;"></span>
          </header>

          <div class="app-content">

            <div class="referral-summary-row">
              <div class="referral-summary-chip referral-summary-chip--invited">
                <span class="referral-summary-chip__icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                </span>
                <strong data-field="totalInvites"></strong>
                <span class="referral-summary-chip__label">Invited</span>
              </div>
              <div class="referral-summary-chip referral-summary-chip--joined">
                <span class="referral-summary-chip__icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m9 12 2 2 4-4"/></svg>
                </span>
                <strong data-field="joinedUsers"></strong>
                <span class="referral-summary-chip__label">Joined</span>
              </div>
              <div class="referral-summary-chip referral-summary-chip--earned">
                <span class="referral-summary-chip__icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9a2.5 2.5 0 0 1 5 0c0 1.7-2.5 2-2.5 4"/></svg>
                </span>
                <strong data-field="rewardsEarned"></strong>
                <span class="referral-summary-chip__label">Earned</span>
              </div>
              <div class="referral-summary-chip referral-summary-chip--pending">
                <span class="referral-summary-chip__icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/></svg>
                </span>
                <strong data-field="pendingRewards"></strong>
                <span class="referral-summary-chip__label">Pending</span>
              </div>
            </div>

            <div class="referral-milestone-card">
              <div class="referral-milestone-card__top">
                <span class="referral-milestone-card__icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="9" width="18" height="12" rx="2"/><path d="M3 13h18M12 9v12M8 9c-2 0-3-1.5-2-3s3.5-1 4 1c.5-2 3-2.5 4-1s0 3-2 3H8Z"/></svg>
                </span>
                <div class="referral-milestone-card__heading">
                  <span class="referral-milestone-card__eyebrow">Next Milestone</span>
                  <strong data-field="nextReward"></strong>
                </div>
              </div>
              <div class="referral-milestone-card__track"><div class="referral-milestone-card__fill" id="referralProgressFill"></div></div>
              <div class="referral-milestone-card__footer">
                <span data-field="milestoneProgress"></span>
                <span class="referral-milestone-card__pct" id="referralProgressPct"></span>
              </div>
            </div>

            <div class="profile-section-title" style="margin-top:20px;">
              <h3>Invite History</h3>
            </div>
            <div class="referral-list" id="referralList"></div>

            <a class="btn-gradient" href="invite-friends.html" style="margin-top:22px;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>
              <span>Invite More Friends</span>
            </a>

          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    hydrateReferralTracking();
  </script>
</body>
</html>
