<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Artable — Wallet</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="device-wrap">
    <div class="device-frame">
      <div class="app-screen app-shell">

        <div class="screen-scroll app-scroll">

          <header class="app-header" style="padding-bottom:0;">
            <div class="top-row" style="margin-bottom:0;">
              <button class="back-btn" type="button" onclick="history.back()" aria-label="Go back">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
              </button>
            </div>
            <div class="app-header__greeting" style="text-align:center; flex:1;">
              <p class="greeting-name" style="font-size:17px;">Wallet</p>
            </div>
            <span style="width:40px;"></span>
          </header>

          <div class="app-content">

            <div class="wallet-balance-card">
              <span class="wallet-balance-card__label">Available Balance</span>
              <p class="wallet-balance-card__amount" data-field="availableBalance"></p>
              <div class="wallet-balance-card__row">
                <div><strong data-field="pendingRewards"></strong><span>Pending</span></div>
                <div><strong data-field="totalWithdrawn"></strong><span>Withdrawn</span></div>
                <div><strong data-field="minWithdrawal"></strong><span>Min. Withdraw</span></div>
              </div>
            </div>

            <div class="wallet-actions-row">
              <a class="btn-gradient" href="withdrawal-request.html">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;"><circle cx="12" cy="12" r="9"/><polyline points="16 12 12 8 8 12"/><line x1="12" y1="16" x2="12" y2="8"/></svg>
                <span>Withdraw</span>
              </a>
              <a class="btn-secondary-outline" href="transaction-history.html">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>
                <span>History</span>
              </a>
            </div>

            <div class="wallet-security-note">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
              <span>Withdrawals processed securely via Razorpay.</span>
            </div>

            <div class="profile-section-title" style="margin-top:22px;">
              <h3>Earnings Summary</h3>
            </div>
            <div class="earnings-summary-grid">
              <div class="earnings-stat">
                <span class="earnings-stat__icon">
                  <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 3h10v4a5 5 0 0 1-4 4.9V15h2a1 1 0 0 1 1 1v1H8v-1a1 1 0 0 1 1-1h2v-3.1A5 5 0 0 1 7 7V3Z"/><path d="M7 4H4a3 3 0 0 0 3 5.3V4Z"/><path d="M17 4h3a3 3 0 0 1-3 5.3V4Z"/><rect x="7" y="19" width="10" height="2" rx="1"/></svg>
                </span>
                <strong data-field="challengeWins"></strong>
                <span>Challenge Wins</span>
              </div>
              <div class="earnings-stat">
                <span class="earnings-stat__icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="16" y1="11" x2="22" y2="11"/></svg>
                </span>
                <strong data-field="referralRewards"></strong>
                <span>Referral Rewards</span>
              </div>
              <div class="earnings-stat">
                <span class="earnings-stat__icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>
                </span>
                <strong data-field="dailyBonus"></strong>
                <span>Daily Bonus</span>
              </div>
              <div class="earnings-stat">
                <span class="earnings-stat__icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m11 17 1.5 1.5a2.1 2.1 0 0 0 3-3L12 12"/><path d="m14.5 14 1.5-1.5a2 2 0 0 0-3-2.7L11 12"/><path d="M4 12h3l4-4 3 3-1.5 1.5"/><path d="M2 10.5 6 7l3.5 3.5"/></svg>
                </span>
                <strong data-field="sponsorRewards"></strong>
                <span>Sponsor Rewards</span>
              </div>
            </div>

            <div class="profile-section-title" style="margin-top:22px;">
              <h3>Recent Transactions</h3>
              <a href="transaction-history.html">See All</a>
            </div>
            <div class="transactions-list" id="recentTransactions"></div>

          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    hydrateWallet();
  </script>
</body>
</html>
