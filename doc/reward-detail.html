<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Artable — Reward Detail</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="device-wrap">
    <div class="device-frame">
      <div class="app-screen app-shell">

        <div class="screen-scroll app-scroll">

          <div class="reward-detail-hero">
            <img data-field="imageUrl" src="" alt="Reward" onerror="imgFallback(this)">
            <div class="top-row" style="position:absolute; top:16px; left:16px; right:16px; margin:0; z-index:1;">
              <button class="back-btn" type="button" onclick="history.back()" aria-label="Go back">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
              </button>
            </div>
          </div>

          <div class="app-content">

            <div class="reward-detail-value-card">
              <div class="reward-detail-value-card__glow"></div>
              <div class="reward-detail-value-card__head">
                <span class="reward-detail-value-card__label">Reward Value</span>
                <span id="rewardStatusSlot"></span>
              </div>
              <p class="reward-detail-value-card__amount" data-field="value"></p>
              <div class="reward-detail-value-card__divider"></div>
              <div class="reward-detail-value-card__expiry">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>
                <span data-field="expiry"></span>
              </div>
              <div class="reward-detail-value-card__note hidden" id="rewardUnlockNote">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
                <span>Unlocks after winner verification.</span>
              </div>
            </div>

            <div class="detail-section">
              <h3 data-field="title" style="margin-bottom:8px;"></h3>
              <span id="rewardTypeSlot"></span>
              <p data-field="description" style="margin-top:12px;"></p>
            </div>

            <div class="detail-section">
              <h3>Eligibility</h3>
              <div class="eligibility-card" id="eligibilityList"></div>
            </div>

            <div id="rewardClaimedNote" class="reward-claimed-note hidden">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;"><circle cx="12" cy="12" r="9"/><path d="m8.5 12.5 2.5 2.5 4.5-5"/></svg>
              <span>Reward claimed! Amount has been credited to your wallet.</span>
            </div>

            <button class="btn-gradient" type="button" id="rewardCtaBtn" style="margin-top:20px;"></button>
            <button class="btn-secondary-outline reward-track-btn hidden" type="button" id="trackPrizeBtn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:17px;height:17px;"><rect x="1" y="6" width="14" height="11" rx="1"/><path d="M15 9h4l3 3v5h-7z"/><circle cx="6" cy="19" r="2"/><circle cx="17.5" cy="19" r="2"/></svg>
              <span>Track Prize</span>
            </button>

          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    hydrateRewardDetail();
  </script>
</body>
</html>
