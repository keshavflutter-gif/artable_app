<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Artable — Transaction History</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="device-wrap">
    <div class="device-frame">
      <div class="app-screen app-shell">

        <div class="screen-scroll app-scroll">

          <header class="app-header" style="padding-bottom:0;">
            <div class="top-row" style="margin-bottom:0;">
              <button class="back-btn" type="button" onclick="history.back()" aria-label="Go back">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
              </button>
            </div>
            <div class="app-header__greeting" style="text-align:center; flex:1;">
              <p class="greeting-name" style="font-size:17px;">Transaction History</p>
            </div>
            <span style="width:40px;"></span>
          </header>

          <div class="app-content">

            <div class="tx-filter-row" id="txFilterChips"></div>

            <div class="transactions-list" id="txList" style="margin-top:16px;"></div>
            <p class="tx-empty-state hidden" id="txEmpty">No transactions in this category yet.</p>

            <div class="tx-ad-banner" style="margin-top:20px;">
              <span class="tx-ad-banner__tag">Ad</span>
              <div class="tx-ad-banner__media">
                <img src="https://images.unsplash.com/photo-1698440235228-9c617924c06e?w=340&h=340&q=80&auto=format&fit=crop" alt="Sponsored" loading="lazy" onerror="imgFallback(this)">
              </div>
              <div class="tx-ad-banner__body">
                <p class="tx-ad-banner__brand">SPORTIFY</p>
                <h3 class="tx-ad-banner__headline">Run Faster.<br>Be Stronger.</h3>
                <a class="tx-ad-banner__cta" href="#" onclick="return comingSoon(event)">Shop Now</a>
              </div>
            </div>

          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    hydrateTransactionHistory();
  </script>
</body>
</html>
