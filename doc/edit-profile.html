<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Artable — Edit Profile</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="device-wrap">
    <div class="device-frame">
      <div class="app-screen app-shell">

        <div class="screen-scroll app-scroll">

          <header class="app-header" style="padding-bottom:0;">
            <div class="top-row" style="margin-bottom:0;">
              <button class="back-btn" type="button" onclick="history.back()" aria-label="Go back">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
              </button>
            </div>
            <div class="app-header__greeting" style="text-align:center; flex:1;">
              <p class="greeting-name" style="font-size:17px;">Edit Profile</p>
            </div>
            <span style="width:40px;"></span>
          </header>

          <div class="edit-cover-area">
            <img data-field="coverUrl" src="" alt="Cover" onerror="imgFallback(this)">
            <button class="edit-cover-area__btn" type="button" onclick="return comingSoon(event)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2Z"/><circle cx="12" cy="13" r="4"/></svg>
              <span>Change Cover</span>
            </button>
          </div>

          <div class="edit-avatar-area">
            <img data-field="avatarUrl" src="" alt="Avatar" onerror="imgFallback(this)">
            <button class="edit-avatar-area__btn" type="button" onclick="return comingSoon(event)" aria-label="Change photo">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2Z"/><circle cx="12" cy="13" r="4"/></svg>
            </button>
          </div>

          <div class="app-content">
            <form id="editProfileForm">

              <div class="form-card">
                <p class="form-card__title">Basic Info</p>
                <div class="form-field">
                  <label for="editFullName">Full Name</label>
                  <input type="text" id="editFullName" placeholder="Your full name">
                </div>
                <div class="form-field">
                  <label for="editUsername">Username</label>
                  <input type="text" id="editUsername" placeholder="username">
                </div>
                <div class="form-field">
                  <label for="editBio">Bio</label>
                  <textarea id="editBio" placeholder="Tell people about your talent..."></textarea>
                </div>
              </div>

              <div class="form-card">
                <p class="form-card__title">Talent</p>
                <div class="form-field">
                  <label for="editCategory">Talent Category</label>
                  <input type="text" id="editCategory" placeholder="e.g. Dance">
                </div>
              </div>

              <div class="form-card">
                <p class="form-card__title">Social Links</p>
                <div class="form-field">
                  <label for="editSocialLink">Instagram / YouTube / Website</label>
                  <input type="text" id="editSocialLink" placeholder="https://">
                </div>
              </div>

              <div class="edit-actions-row">
                <button class="btn-secondary-outline" type="button" id="editCancelBtn"><span>Cancel</span></button>
                <button class="btn-gradient" type="submit"><span>Save Changes</span></button>
              </div>
              <div class="edit-saved-note hidden" id="editSavedNote">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                <span>Profile updated successfully.</span>
              </div>

            </form>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    hydrateEditProfile();
  </script>
</body>
</html>
