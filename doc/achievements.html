<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Artable — Achievements</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="device-wrap">
    <div class="device-frame">
      <div class="app-screen app-shell">

        <div class="screen-scroll app-scroll">

          <header class="app-header" style="padding-bottom:0;">
            <div class="top-row" style="margin-bottom:0;">
              <button class="back-btn" type="button" onclick="history.back()" aria-label="Go back">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
              </button>
            </div>
            <div class="app-header__greeting" style="text-align:center; flex:1;">
              <p class="greeting-name" style="font-size:17px;">Achievements</p>
            </div>
            <span style="width:40px;"></span>
          </header>

          <div class="app-content">

            <div class="achievement-summary-card">
              <span class="achievement-summary-card__level">Current Level</span>
              <p class="achievement-summary-card__level-name" data-field="currentLevel"></p>
              <div class="achievement-summary-card__row">
                <div class="achievement-summary-card__stat">
                  <strong data-field="badgesEarned"></strong>
                  <span>Badges Earned</span>
                </div>
                <div class="achievement-summary-card__stat">
                  <strong data-field="nextMilestone" style="font-size:12px;"></strong>
                  <span>Next Milestone</span>
                </div>
              </div>
            </div>

            <div id="badgeGroups"></div>

          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    hydrateAchievements();
  </script>
</body>
</html>
