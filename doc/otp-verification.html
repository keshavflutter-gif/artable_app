<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Artable — Verify OTP</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="device-wrap">
    <div class="device-frame">
      <div class="app-screen">
        <div class="bg-decoration">
          <img class="bg-frame" src="assets/bg-frame-2.png" alt="">
        </div>

        <div class="screen-scroll">

          <div class="top-row">
            <button class="back-btn" type="button" onclick="window.location.href='signup.html'" aria-label="Go back">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
            </button>
          </div>

          <div class="logo-header icon-only">
            <div class="logo-mark"><img src="assets/logo.svg" alt="Artable logo"></div>
          </div>

          <h2 class="screen-title text-center">Verify OTP</h2>
          <p class="screen-subtitle text-center">
            Enter the verification code sent to your mobile number/email
            <br><strong data-otp-destination>+1 •••• •• 123</strong>
          </p>

          <form id="otpForm" novalidate>
            <div class="otp-row" aria-label="One time password">
              <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 1">
              <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 2">
              <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 3">
              <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 4">
              <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 5">
              <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 6">
            </div>

            <div class="resend-row">
              <span id="resendTimer">Resend code in 00:30</span>
              <button id="resendBtn" type="button" class="hidden">Resend Code</button>
            </div>

            <button class="btn-gradient" id="verifyBtn" type="submit">
              VERIFY
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script>
    initOtpInputs('.otp-row');
    startResendTimer(30);

    document.getElementById('otpForm').addEventListener('submit', (e) => {
      e.preventDefault();
      if (!isOtpComplete('.otp-row')) {
        flagOtpError('.otp-row', 'verifyBtn');
        return;
      }
      // TODO(api): verify the 6-digit code with the backend, then
      // route to reset-password.html (forgot-password flow) or the
      // home dashboard (sign-up flow) depending on entry context.
      window.location.href = 'reset-password.html';
    });
  </script>
</body>
</html>
