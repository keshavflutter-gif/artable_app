<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Artable — Video Details</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="device-wrap">
    <div class="device-frame">
      <div class="app-screen app-shell">

        <div class="screen-scroll app-scroll">

          <header class="app-header">
            <div class="top-row" style="margin-bottom:0;">
              <button class="back-btn" type="button" onclick="history.back()" aria-label="Go back">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
              </button>
            </div>
            <div class="app-header__greeting" style="text-align:center; flex:1;">
              <p class="greeting-name" style="font-size:17px;">Video Details</p>
            </div>
            <span style="width:40px;"></span>
          </header>

          <div class="app-content">

            <div id="detailsStepRow"></div>

            <div class="details-preview-card">
              <img id="detailsPreviewPoster" src="" alt="Recorded video">
              <button class="details-preview-card__play" type="button" id="detailsPreviewPlayBtn" aria-label="Play preview">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
              </button>
              <span class="details-preview-card__duration" id="detailsPreviewDuration">0:00</span>
            </div>

            <div class="selected-music-chip hidden" id="selectedMusicChip">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>
              <span></span>
            </div>

            <div class="field-group" style="margin-top:14px;">
              <span class="field-label">Title</span>
              <div class="auth-input">
                <input type="text" id="detailsTitle" placeholder="Give your entry a title" required>
              </div>
            </div>

            <div class="field-group">
              <span class="field-label">Description</span>
              <textarea class="studio-textarea" id="detailsDescription" placeholder="Tell viewers about your entry"></textarea>
            </div>

            <div class="field-group">
              <span class="field-label">Category</span>
              <div class="auth-input">
                <select id="categorySelect"></select>
              </div>
            </div>

            <div class="field-group">
              <span class="field-label">Hashtags</span>
              <div class="auth-input">
                <input type="text" id="detailsHashtags" placeholder="#dance #talent #artable">
              </div>
              <div class="hashtag-chip-row" id="hashtagChipRow"></div>
            </div>

            <div class="field-group">
              <span class="field-label">Challenge</span>
              <div class="auth-input">
                <select id="challengeSelect"></select>
              </div>
            </div>

            <div class="summary-card">
              <img data-field="summaryImage" src="" alt="Challenge">
              <div class="summary-card__body">
                <h3 data-field="summaryTitle"></h3>
                <p data-field="summaryCategory"></p>
                <p data-field="summaryPrize"></p>
                <p data-field="summaryEndDate"></p>
              </div>
            </div>

            <div class="detail-section">
              <h3>Before You Submit</h3>
              <ul class="checklist">
                <li class="checklist-item">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                  <span>My video is original content.</span>
                </li>
                <li class="checklist-item">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                  <span>I followed the community guidelines.</span>
                </li>
                <li class="checklist-item">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                  <span>Video is recorded in Artable Studio.</span>
                </li>
              </ul>
            </div>

            <div class="rating-note">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 15 9 22 9.3 16.6 14 18.2 21 12 17.3 5.8 21 7.4 14 2 9.3 9 9 Z"/></svg>
              <span>Winners are decided by Talent Score. Likes and shares improve visibility.</span>
            </div>

            <label class="field-checkbox-row" style="margin-top:14px;">
              <input type="checkbox" id="detailsConfirmCheck">
              <span>I confirm this is my original work recorded in Artable Studio.</span>
            </label>

            <div class="preview-actions" style="margin-top:16px;">
              <button class="btn-secondary-outline" type="button" id="saveDetailsDraftBtn">
                <span>Save Draft</span>
              </button>
              <button class="btn-gradient" type="button" id="submitDetailsBtn" disabled>
                <span>Submit Entry</span>
              </button>
            </div>

          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    hydrateStudioDetails();
  </script>
</body>
</html>
