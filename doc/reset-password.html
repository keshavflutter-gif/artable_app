<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Artable — Reset Password</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="device-wrap">
    <div class="device-frame">
      <div class="app-screen">
        <div class="bg-decoration">
          <img class="bg-frame" src="assets/bg-frame-1.png" alt="">
        </div>

        <div class="screen-scroll">

          <!-- ===== Form state ===== -->
          <div id="resetFormState">
            <div class="top-row">
              <button class="back-btn" type="button" onclick="window.location.href='login.html'" aria-label="Go back">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
              </button>
            </div>

            <div class="logo-header icon-only">
              <div class="logo-mark"><img src="assets/logo.svg" alt="Artable logo"></div>
            </div>

            <h2 class="screen-title">Reset Password</h2>
            <p class="screen-subtitle">Create a new password that's at least 8 characters long</p>

            <form id="resetForm" novalidate>
              <div class="field-group">
                <div class="auth-input">
                  <span class="field-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M7 10V7a5 5 0 0 1 10 0v3"/></svg>
                  </span>
                  <input id="newPassword" type="password" placeholder="New Password" autocomplete="new-password" required>
                  <button type="button" class="field-toggle" data-toggle-for="newPassword" aria-label="Show password">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                  </button>
                </div>
              </div>

              <div class="field-group">
                <div class="auth-input">
                  <span class="field-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M7 10V7a5 5 0 0 1 10 0v3"/></svg>
                  </span>
                  <input id="confirmNewPassword" type="password" placeholder="Confirm New Password" autocomplete="new-password" required>
                  <button type="button" class="field-toggle" data-toggle-for="confirmNewPassword" aria-label="Show password">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                  </button>
                </div>
              </div>

              <button class="btn-gradient" type="submit" style="margin-top:8px;">
                RESET PASSWORD
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
              </button>
            </form>
          </div>

          <!-- ===== Success state placeholder ===== -->
          <div id="resetSuccessState" class="success-panel hidden" style="flex:1; justify-content:center; margin: auto 0;">
            <div class="success-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            </div>
            <h2>Password Reset!</h2>
            <p>Your password has been changed successfully. You can now log in with your new password.</p>
            <button class="btn-gradient" type="button" onclick="window.location.href='login.html'">
              BACK TO LOGIN
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
            </button>
          </div>

        </div>
      </div>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script>
    document.getElementById('resetForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const pass = document.getElementById('newPassword').value;
      const confirm = document.getElementById('confirmNewPassword').value;

      if (pass.length < 8) {
        showFieldHint('newPassword', 'Password must be at least 8 characters', 'error');
        return;
      }
      if (pass !== confirm) {
        showFieldHint('confirmNewPassword', 'Passwords do not match', 'error');
        return;
      }

      // TODO(api): call reset-password endpoint with the new password.
      // Below simply flips a UI state to preview the success screen.
      document.getElementById('resetFormState').classList.add('hidden');
      document.getElementById('resetSuccessState').classList.remove('hidden');
    });
  </script>
</body>
</html>
