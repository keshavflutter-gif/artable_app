<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Artable — Challenge Detail</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="device-wrap">
    <div class="device-frame">
      <div class="app-screen app-shell">

        <div class="screen-scroll app-scroll">

          <div class="hero-banner">
            <img data-field="heroImage" src="" alt="Challenge banner">
            <div class="top-row">
              <button class="back-btn" type="button" onclick="window.location.href='challenges.html'" aria-label="Go back">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
              </button>
            </div>
            <div class="hero-banner__text">
              <span data-field="status"></span>
              <h1 data-field="title"></h1>
            </div>
          </div>

          <div class="app-content" style="padding-top:18px;">

            <div class="detail-stat-row">
              <div class="detail-stat">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 15 9 22 9.3 16.6 14 18.2 21 12 17.3 5.8 21 7.4 14 2 9.3 9 9 Z"/></svg>
                <strong data-field="prize"></strong>
                <span>Prize</span>
              </div>
              <div class="detail-stat">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                <strong data-field="participants"></strong>
                <span>Joined</span>
              </div>
              <div class="detail-stat">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>
                <strong data-field="countdownMain"></strong>
                <span class="detail-stat__sub" data-field="countdownSub"></span>
              </div>
            </div>

            <p style="margin:14px 0 0; font-size:12.5px; color:var(--color-text-soft);">
              Category: <strong data-field="category" style="color:var(--color-purple);"></strong>
            </p>

            <div class="detail-section">
              <h3>About this Challenge</h3>
              <p data-field="description"></p>
            </div>

            <div class="rating-note">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 15 9 22 9.3 16.6 14 18.2 21 12 17.3 5.8 21 7.4 14 2 9.3 9 9 Z"/></svg>
              <span>Winners are decided by Talent Score. Likes and shares improve visibility.</span>
            </div>

            <div class="detail-section">
              <h3>Rules</h3>
              <div class="rules-card" id="rulesList"></div>
            </div>

            <div class="detail-section">
              <h3>Prize Breakdown</h3>
              <div class="prize-card" id="prizeList"></div>
            </div>

            <div class="detail-section">
              <h3>Top Participants</h3>
              <div id="topParticipants"></div>
            </div>

            <div class="detail-cta-row">
              <button class="btn-outline-icon" type="button" id="shareBtn" aria-label="Share challenge">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"/><line x1="15.4" y1="6.5" x2="8.6" y2="10.5"/></svg>
              </button>
              <a class="btn-gradient" id="joinChallengeBtn" href="submit-entry.html">
                <span>Join Challenge</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
              </a>
            </div>

          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    hydrateChallengeDetail();
  </script>
</body>
</html>
