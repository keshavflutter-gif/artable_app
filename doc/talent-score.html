<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Artable — Talent Score</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="device-wrap">
    <div class="device-frame">
      <div class="app-screen app-shell">

        <div class="screen-scroll app-scroll">

          <header class="app-header" style="padding-bottom:0;">
            <div class="top-row" style="margin-bottom:0;">
              <button class="back-btn" type="button" onclick="history.back()" aria-label="Go back">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
              </button>
            </div>
            <div class="app-header__greeting" style="text-align:center; flex:1;">
              <p class="greeting-name" style="font-size:17px;">Talent Score</p>
            </div>
            <span style="width:40px;"></span>
          </header>

          <div class="app-content">

            <div class="talent-score-hero">
              <span class="talent-score-hero__label">Overall Talent Score</span>
              <p class="talent-score-hero__value" data-field="talentScore"></p>
              <div class="talent-score-hero__row">
                <div><strong data-field="avgRating"></strong><span>Avg Rating</span></div>
                <div><strong data-field="totalVotes"></strong><span>Total Votes</span></div>
                <div><strong>↑ Trending</strong><span>Rating Trend</span></div>
              </div>
            </div>

            <div class="stats-grid">
              <div class="stats-card">
                <span class="stats-card__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8v4a4 4 0 0 1-8 0V4Z"/><path d="M8 5H5a3 3 0 0 0 3 5M16 5h3a3 3 0 0 1-3 5M10 15h4v3h-4zM8 21h8"/></svg></span>
                <strong data-field="challengesWon"></strong><span>Challenges Won</span>
              </div>
              <div class="stats-card">
                <span class="stats-card__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg></span>
                <strong data-field="winRate"></strong><span>Win Rate</span>
              </div>
              <div class="stats-card">
                <span class="stats-card__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="9" width="18" height="12" rx="2"/><path d="M3 13h18M12 9v12M8 9c-2 0-3-1.5-2-3s3.5-1 4 1c.5-2 3-2.5 4-1s0 3-2 3H8Z"/></svg></span>
                <strong data-field="rewardEarnings"></strong><span>Reward Earnings</span>
              </div>
              <div class="stats-card">
                <span class="stats-card__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="M16 10.5 22 7v10l-6-3.5Z"/></svg></span>
                <strong data-field="totalVideos"></strong><span>Total Videos</span>
              </div>
              <div class="stats-card">
                <span class="stats-card__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg></span>
                <strong data-field="totalViews"></strong><span>Total Views</span>
              </div>
              <div class="stats-card">
                <span class="stats-card__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z"/></svg></span>
                <strong data-field="totalLikes"></strong><span>Total Likes</span>
              </div>
            </div>

            <div class="detail-section">
              <h3>Rating Breakdown (1–10)</h3>
              <div class="score-bar-list" id="ratingBreakdown"></div>
            </div>

            <div class="detail-section">
              <h3>Recent Challenge Performance</h3>
              <div class="performance-list" id="recentPerformance"></div>
            </div>

            <div class="rating-note-box">
              <span class="rating-note-box__icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 15 9 22 9.3 16.6 14 18.2 21 12 17.3 5.8 21 7.4 14 2 9.3 9 9 Z"/></svg>
              </span>
              <div class="rating-note-box__text">
                <strong>Winners are decided by Talent Score</strong>
                <span>Likes and shares improve visibility.</span>
              </div>
            </div>

          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    hydrateTalentStats();
  </script>
</body>
</html>
