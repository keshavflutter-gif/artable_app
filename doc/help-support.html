<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Artable — Help & Support</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="device-wrap">
    <div class="device-frame">
      <div class="app-screen app-shell">

        <div class="screen-scroll app-scroll">

          <header class="app-header" style="padding-bottom:0;">
            <div class="top-row" style="margin-bottom:0;">
              <button class="back-btn" type="button" onclick="history.back()" aria-label="Go back">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
              </button>
            </div>
            <div class="app-header__greeting" style="text-align:center; flex:1;">
              <p class="greeting-name" style="font-size:17px;">Help & Support</p>
            </div>
            <span style="width:40px;"></span>
          </header>

          <div class="app-content">

            <div class="help-search-bar">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              <input type="text" id="helpSearchInput" placeholder="Search help topics...">
            </div>

            <div class="profile-section-title" style="margin-top:20px;">
              <h3>Quick Help</h3>
            </div>
            <div class="help-topics-grid" id="helpTopicsGrid"></div>

            <div class="profile-section-title" style="margin-top:22px;">
              <h3>Frequently Asked Questions</h3>
            </div>
            <div class="faq-list" id="faqList"></div>

            <div class="contact-support-card">
              <span class="contact-support-card__icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5Z"/></svg>
              </span>
              <div class="contact-support-card__body">
                <strong>Need more help?</strong>
                <span>Our team is here for you.</span>
              </div>
              <a class="contact-support-card__btn" href="#" onclick="return comingSoon(event)">Contact Support</a>
            </div>

            <a class="ticket-placeholder-row" href="#" onclick="return comingSoon(event)">
              <span class="ticket-placeholder-row__icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/></svg>
              </span>
              <span class="ticket-placeholder-row__label">Submit a support request</span>
              <span class="ticket-placeholder-row__chevron"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg></span>
            </a>

          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    hydrateHelpSupport();
  </script>
</body>
</html>
