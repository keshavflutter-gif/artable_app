<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Artable — Prize Tracking</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="device-wrap">
    <div class="device-frame">
      <div class="app-screen app-shell">

        <div class="screen-scroll app-scroll">

          <header class="app-header" style="padding-bottom:0;">
            <div class="top-row" style="margin-bottom:0;">
              <button class="back-btn" type="button" onclick="history.back()" aria-label="Go back">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
              </button>
            </div>
            <div class="app-header__greeting" style="text-align:center; flex:1;">
              <p class="greeting-name" style="font-size:17px;">Prize Tracking</p>
            </div>
            <span style="width:40px;"></span>
          </header>

          <div class="app-content">

            <div class="prize-summary-card">
              <div class="prize-summary-card__media">
                <img data-field="prizeImage" src="" alt="Prize" onerror="imgFallback(this)">
              </div>
              <div class="prize-summary-card__body">
                <div class="prize-summary-card__top-row">
                  <span class="prize-summary-card__eyebrow">Prize Item</span>
                  <span class="prize-status-badge" id="prizeStatusBadge"></span>
                </div>
                <strong data-field="prizeName"></strong>
                <span class="prize-summary-card__challenge" data-field="challengeName"></span>
                <span class="prize-summary-card__won">Won on <span data-field="winnerDate"></span></span>
              </div>
            </div>

            <div class="prize-meta-row">
              <div class="prize-meta-chip">
                <span class="prize-meta-chip__icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>
                </span>
                <div class="prize-meta-chip__body">
                  <strong data-field="estimatedDate"></strong>
                  <span class="prize-meta-chip__label">Est. Delivery</span>
                  <span class="prize-meta-chip__helper">Expected shipping window</span>
                </div>
              </div>
              <div class="prize-meta-chip">
                <span class="prize-meta-chip__icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="6" width="14" height="11" rx="1"/><path d="M15 9h4l3 3v5h-7z"/><circle cx="6" cy="19" r="2"/><circle cx="17.5" cy="19" r="2"/></svg>
                </span>
                <div class="prize-meta-chip__body">
                  <strong data-field="trackingId"></strong>
                  <span class="prize-meta-chip__label">Tracking ID</span>
                  <span class="prize-meta-chip__helper">Courier reference</span>
                </div>
              </div>
            </div>

            <div class="profile-section-title" style="margin-top:22px;">
              <h3>Delivery Status</h3>
            </div>
            <div class="prize-timeline-card">
              <div class="prize-timeline" id="prizeTimeline"></div>
            </div>

            <button class="btn-gradient" type="button" id="viewRewardDetailBtn" style="margin-top:22px;">
              <span>View Reward Detail</span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;"><polyline points="9 6 15 12 9 18"/></svg>
            </button>

            <a class="prize-help-card" href="#" onclick="return comingSoon(event)">
              <span class="prize-help-card__icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 0 1 5 0c0 1.5-2 1.7-2 3.3"/><line x1="12" y1="16.2" x2="12" y2="16.2"/></svg>
              </span>
              <div class="prize-help-card__body">
                <strong>Need help?</strong>
                <span>Contact support for delivery updates.</span>
              </div>
              <span class="prize-help-card__arrow">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>
              </span>
            </a>

          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    hydratePrizeTracking();
  </script>
</body>
</html>
