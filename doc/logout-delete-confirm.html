<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Artable — Confirm</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="device-wrap">
    <div class="device-frame">
      <div class="app-screen app-shell">

        <div class="screen-scroll app-scroll">

          <header class="app-header" style="padding-bottom:0;">
            <div class="top-row" style="margin-bottom:0;">
              <button class="back-btn" type="button" onclick="history.back()" aria-label="Go back">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
              </button>
            </div>
            <div class="app-header__greeting" style="text-align:center; flex:1;">
              <p class="greeting-name" style="font-size:17px;">Confirm</p>
            </div>
            <span style="width:40px;"></span>
          </header>

          <div class="app-content">

            <div class="confirm-action-card confirm-action-card--logout" id="logoutConfirmView">
              <span class="confirm-action-card__icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
              </span>
              <h2>Log out?</h2>
              <p>You can log in again anytime.</p>
              <div class="confirm-action-row">
                <button class="btn-gradient" type="button" id="confirmLogoutBtn"><span>Log Out</span></button>
                <button class="btn-secondary-outline" type="button" id="cancelLogoutBtn"><span>Cancel</span></button>
              </div>
            </div>

            <div class="confirm-action-card confirm-action-card--delete hidden" id="deleteConfirmView">
              <span class="confirm-action-card__icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
              </span>
              <h2>Delete account?</h2>
              <p class="confirm-action-card__warning">This action may remove your profile, videos, rewards history, and account data.</p>

              <label class="danger-checkbox-row">
                <input type="checkbox" id="deleteConfirmCheckbox">
                <span>I understand this action cannot be undone.</span>
              </label>

              <div class="confirm-action-row">
                <button class="btn-danger" type="button" id="confirmDeleteBtn"><span>Delete Account</span></button>
                <button class="btn-secondary-outline" type="button" id="cancelDeleteBtn"><span>Cancel</span></button>
              </div>
            </div>

          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    hydrateLogoutConfirm();
  </script>
</body>
</html>
