<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Artable — Change Password</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="device-wrap">
    <div class="device-frame">
      <div class="app-screen app-shell">

        <div class="screen-scroll app-scroll">

          <header class="app-header" style="padding-bottom:0;">
            <div class="top-row" style="margin-bottom:0;">
              <button class="back-btn" type="button" onclick="history.back()" aria-label="Go back">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
              </button>
            </div>
            <div class="app-header__greeting" style="text-align:center; flex:1;">
              <p class="greeting-name" style="font-size:17px;">Change Password</p>
            </div>
            <span style="width:40px;"></span>
          </header>

          <div class="app-content">

            <div class="info-note-card" style="margin-top:16px;">
              <span class="info-note-card__icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
              </span>
              <div class="info-note-card__text">
                <strong>Keep your account secure</strong>
                <span>Use a strong password to keep your ARTABLE account secure.</span>
              </div>
            </div>

            <div class="password-input-group">
              <div class="password-input-row">
                <label>Current Password</label>
                <div class="password-input-row__field">
                  <input type="password" id="currentPasswordInput" placeholder="Enter current password">
                  <button class="password-input-row__eye" type="button" data-toggle-eye="currentPasswordInput" aria-label="Show password"></button>
                </div>
              </div>
              <div class="password-input-row">
                <label>New Password</label>
                <div class="password-input-row__field">
                  <input type="password" id="newPasswordInput" placeholder="Enter new password">
                  <button class="password-input-row__eye" type="button" data-toggle-eye="newPasswordInput" aria-label="Show password"></button>
                </div>
                <div class="password-strength-card">
                  <div class="password-strength-card__track"><div class="password-strength-card__fill" id="passwordStrengthFill"></div></div>
                  <span class="password-strength-card__label" id="passwordStrengthLabel"></span>
                </div>
              </div>
              <div class="password-input-row">
                <label>Confirm New Password</label>
                <div class="password-input-row__field">
                  <input type="password" id="confirmPasswordInput" placeholder="Re-enter new password">
                  <button class="password-input-row__eye" type="button" data-toggle-eye="confirmPasswordInput" aria-label="Show password"></button>
                </div>
              </div>
            </div>

            <div class="password-rules-card">
              <strong>Password Rules</strong>
              <div class="password-rule-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                <span>At least 8 characters</span>
              </div>
              <div class="password-rule-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                <span>Use letters and numbers</span>
              </div>
              <div class="password-rule-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                <span>Avoid common passwords</span>
              </div>
            </div>

            <button class="btn-gradient" type="button" id="updatePasswordBtn" style="margin-top:22px;">
              <span>Update Password</span>
            </button>

          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    hydrateChangePassword();
  </script>
</body>
</html>
