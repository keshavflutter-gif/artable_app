<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Artable — Leaderboard</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="device-wrap">
    <div class="device-frame">
      <div class="app-screen app-shell">

        <div class="screen-scroll app-scroll">

          <header class="app-header" style="padding-bottom:0;">
            <div class="top-row" style="margin-bottom:0;">
              <button class="back-btn" type="button" onclick="history.back()" aria-label="Go back">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
              </button>
            </div>
            <div class="app-header__greeting" style="text-align:center; flex:1;">
              <p class="greeting-name" style="font-size:17px;">Leaderboard</p>
            </div>
            <span style="width:40px;"></span>
          </header>

          <div class="app-content">

            <div class="tab-row leaderboard-tabs" style="margin-top:14px;">
              <button class="tab-btn active" type="button" data-tab="global">Global</button>
              <button class="tab-btn" type="button" data-tab="challenge">Challenge</button>
              <button class="tab-btn" type="button" data-tab="weekly">Weekly</button>
              <button class="tab-btn" type="button" data-tab="monthly">Monthly</button>
            </div>

            <div class="filter-pill-row" id="leaderboardCategoryChips"></div>

            <div class="leaderboard-podium" id="leaderboardPodium"></div>

            <div class="your-rank-card" id="yourRankCard"></div>

            <div class="detail-section">
              <h3>Full Rankings</h3>
              <div class="leaderboard-list" id="leaderboardList"></div>
            </div>

          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    hydrateLeaderboard();
  </script>
</body>
</html>
